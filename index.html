<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./assets/unblot_logo.png">
  <title>Unblot</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ======================================
       UNBLOT â€” BRUTALIST DESIGN SYSTEM
       ====================================== */

    .force-hide { display: none !important; }
    .hidden { display: none !important; }

    /* === CSS CUSTOM PROPERTIES === */
    :root {
      --ink: #0f0e0b;
      --paper: #f0ebe0;
      --cream: #e8e0cc;
      --rust: #c4430a;
      --gold: #b8860b;
      --shadow-depth: 6px;
      --shadow-color: #0f0e0b;
      --font-serif: 'Playfair Display', serif;
      --font-mono: 'Space Mono', monospace;
      /* Backward-compatible aliases */
      --primary: #c4430a;
      --primary-light: #d4641a;
      --primary-dark: #7a2805;
      --accent: #b8860b;
      --accent-light: #d4a017;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --surface: #f0ebe0;
      --surface-elevated: #f0ebe0;
      --surface-card: #f0ebe0;
      --surface-hover: #e8e0cc;
      --background: #f0ebe0;
      --text-primary: #0f0e0b;
      --text-secondary: #3d3a33;
      --text-muted: #7a7567;
      --border: #0f0e0b;
      --border-subtle: #c4b99a;
      --shadow-sm: 3px 3px 0 #0f0e0b;
      --shadow-md: 6px 6px 0 #0f0e0b;
      --shadow-lg: 8px 8px 0 #0f0e0b;
      --shadow-glow: none;
      --sidebar-bg: #f0ebe0;
      --sidebar-hover: #e8e0cc;
      --sidebar-active: #e8e0cc;
      --sidebar-border: #0f0e0b;
      --topbar-bg: #f0ebe0;
      --card-border: #0f0e0b;
      --radius-sm: 0;
      --radius-md: 0;
      --radius-lg: 0;
      --radius-full: 0;
      --transition-fast: 0.1s ease;
      --transition-normal: 0.2s ease;
      --transition-slow: 0.3s ease;
    }

    /* === DARK THEME (inverted brutalist) === */
    [data-theme="dark"] {
      --ink: #f0ebe0;
      --paper: #0f0e0b;
      --cream: #1a1916;
      --shadow-color: #f0ebe0;
      --primary: #d4641a;
      --primary-light: #e8834a;
      --primary-dark: #c4430a;
      --accent: #d4a017;
      --surface: #0f0e0b;
      --surface-elevated: #1a1916;
      --surface-card: #0f0e0b;
      --surface-hover: #1a1916;
      --background: #0f0e0b;
      --text-primary: #f0ebe0;
      --text-secondary: #c4b99a;
      --text-muted: #7a7567;
      --border: #f0ebe0;
      --border-subtle: #3d3a33;
      --shadow-sm: 3px 3px 0 #f0ebe0;
      --shadow-md: 6px 6px 0 #f0ebe0;
      --shadow-lg: 8px 8px 0 #f0ebe0;
      --sidebar-bg: #0f0e0b;
      --sidebar-hover: #1a1916;
      --sidebar-active: #1a1916;
      --sidebar-border: #f0ebe0;
      --topbar-bg: #0f0e0b;
      --card-border: #f0ebe0;
    }

    /* === RESET & BASE === */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--paper);
      font-family: var(--font-mono);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
      cursor: none; /* Hide default cursor for custom cursor */
    }
    h1, h2, h3, .poem-title, .poem-title-link, .section-header,
    .hero-title, .featured-title, .empty-title, .admin-title {
      font-family: var(--font-serif);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .poem-content {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-style: italic;
      font-weight: 400;
      line-height: 1.8;
      color: var(--ink);
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      margin: 0;
    }
    /* Override Tailwind border-radius */
    .rounded, .rounded-sm, .rounded-md, .rounded-lg, .rounded-xl,
    .rounded-2xl, .rounded-3xl, .rounded-full {
      border-radius: 0 !important;
    }

    /* === NOISE TEXTURE OVERLAY === */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10000;
      opacity: 0.4;
    }

    /* === CUSTOM CURSOR === */
    .cursor {
      width: 20px; height: 20px;
      background: var(--rust);
      border: 2px solid var(--ink);
      border-radius: 50%;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      mix-blend-mode: normal;
    }
    .cursor.expand {
      width: 40px; height: 40px;
      background: var(--rust);
      border: 2px solid var(--ink);
      opacity: 0.8;
    }
    @media (hover: none) and (pointer: coarse) {
      .cursor { display: none !important; }
      body { cursor: auto !important; }
    }

    /* === PAGE TRANSITION === */
    #app { animation: pageEnter 0.3s ease-out; }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === LEFT SIDEBAR NAVIGATION === */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      background: var(--paper);
      border-right: 1px solid var(--border-subtle);
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .nav-bar {
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 2px;
      flex: 1;
      min-height: 0;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: none;
      flex-shrink: 0;
      margin-bottom: 1.25rem;
      padding: 4px 0;
    }
    .nav-brand-text {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .nav-brand-text .rust { color: var(--rust); }

    /* Compose Poem button */
    .compose-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      background: var(--rust);
      color: #f0ebe0;
      border: none;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      cursor: none;
      box-shadow: 0 2px 8px rgba(196, 67, 10, 0.25);
      transition: all 0.15s ease;
      margin-bottom: 1.5rem;
    }
    .compose-btn:hover { background: #d4641a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(196, 67, 10, 0.3); }
    .compose-btn svg { flex-shrink: 0; }

    /* Section labels */
    .nav-section-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 12px 12px 6px;
      margin-top: 4px;
    }

    /* Sidebar nav buttons */
    .nav-sidebar-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: none;
      transition: all 0.15s ease;
      position: relative;
      text-align: left;
    }
    .nav-sidebar-btn:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }
    .nav-sidebar-btn.nav-active {
      background: var(--cream);
      color: var(--rust);
      font-weight: 700;
    }
    .nav-sidebar-btn svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .nav-sidebar-btn:hover svg { opacity: 0.85; }
    .nav-sidebar-btn.nav-active svg { opacity: 1; color: var(--rust); }
    .nav-sidebar-btn .nav-badge {
      position: absolute;
      top: 4px; right: 8px;
      background: var(--rust);
      color: #f0ebe0;
      font-size: 0.5rem;
      font-weight: 700;
      padding: 1px 5px;
      min-width: 14px;
      text-align: center;
      line-height: 1.3;
      border-radius: 8px;
    }
    .nav-sidebar-btn .nav-count {
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .nav-sidebar-btn.nav-active .nav-count { color: var(--rust); }

    /* Auth section at bottom of sidebar */
    #nav-auth-section {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    /* User profile at bottom of sidebar */
    .nav-user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      margin-top: auto;
      border-top: 1px solid var(--border-subtle);
    }
    .nav-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--cream);
      color: var(--ink);
      flex-shrink: 0;
    }
    .nav-user-info { flex: 1; min-width: 0; }
    .nav-user-name {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-logout-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      transition: all 0.15s ease;
      flex-shrink: 0;
      border-radius: 8px;
    }
    .nav-logout-icon:hover { background: var(--surface-hover); color: var(--rust); }

    /* Theme toggle button */
    .nav-theme-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .nav-theme-btn:hover { background: var(--surface-hover); color: var(--ink); }

    /* Content top bar (search + actions) */
    .content-topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--paper);
    }
    .content-search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-hover);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 16px;
      max-width: 560px;
      flex: 1;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .content-search-form:focus-within {
      border-color: var(--rust);
      box-shadow: 0 0 0 3px rgba(196, 67, 10, 0.08);
    }
    .content-search-form svg { flex-shrink: 0; color: var(--text-muted); }
    .content-search-input {
      border: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--ink);
      outline: none;
      width: 100%;
    }
    .content-search-input::placeholder { color: var(--text-muted); }
    .content-topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .topbar-icon-btn {
      width: 38px; height: 38px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      transition: all 0.15s ease;
      position: relative;
    }
    .topbar-icon-btn:hover { background: var(--surface-hover); color: var(--ink); }
    .topbar-notif-dot {
      position: absolute;
      top: 6px; right: 6px;
      width: 8px; height: 8px;
      background: var(--rust);
      border-radius: 50%;
      border: 2px solid var(--paper);
      display: none;
    }

    /* Mobile top bar (shown on small screens) */
    .mobile-topbar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: var(--paper);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 100;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .hamburger {
      background: none;
      border: none;
      padding: 8px;
      cursor: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hamburger span {
      width: 20px; height: 2px;
      background: var(--ink);
      border-radius: 2px;
      display: block;
    }
    .mobile-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Sidebar overlay for mobile */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 14, 11, 0.4);
      z-index: 99;
    }
    .sidebar-overlay.show { display: block; }

    /* === 3D BUTTON SYSTEM === */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--ink);
      padding: 12px 28px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: none;
      box-shadow: var(--shadow-md);
      transition: box-shadow 0.1s ease, transform 0.1s ease;
    }
    .btn-3d:hover {
      box-shadow: 2px 2px 0 var(--shadow-color);
      transform: translate(4px, 4px);
    }
    .btn-3d:active {
      box-shadow: 0 0 0 var(--shadow-color);
      transform: translate(6px, 6px);
    }
    .btn-3d.outline {
      background: transparent;
      color: var(--ink);
    }
    .btn-3d.rust {
      background: var(--rust);
      color: #f0ebe0;
      border-color: var(--rust);
      box-shadow: 6px 6px 0 #7a2805;
    }
    .btn-3d.rust:hover { box-shadow: 2px 2px 0 #7a2805; transform: translate(4px, 4px); }
    .btn-3d.rust:active { box-shadow: 0 0 0 #7a2805; transform: translate(6px, 6px); }
    .btn-3d.small { padding: 8px 16px; font-size: 0.62rem; }

    /* Backward-compat button aliases */
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 2px solid var(--ink);
      cursor: none;
      transition: all 0.1s ease;
    }
    .action-btn-primary {
      background: var(--ink);
      color: var(--paper);
      box-shadow: var(--shadow-sm);
    }
    .action-btn-primary:hover { box-shadow: 0 0 0 var(--ink); transform: translate(3px, 3px); }
    .action-btn-secondary {
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .action-btn-secondary:hover { background: var(--cream); box-shadow: 0 0 0 var(--ink); transform: translate(3px, 3px); }
    .action-btn-like {
      background: transparent;
      color: var(--rust);
      border-color: var(--rust);
    }
    .action-btn-like:hover, .action-btn-like.active { background: var(--rust); color: var(--paper); }
    .action-btn-minimal {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
    }
    .action-btn-minimal:hover { background: var(--cream); }
    .action-btn-minimal.liked { color: var(--rust) !important; border-color: var(--rust); }

    /* Search form in sidebar */
    .nav-search-form {
      display: flex;
      align-items: center;
      border: 2px solid var(--ink);
      margin-bottom: 12px;
    }
    .nav-search-input {
      border: none;
      background: transparent;
      padding: 8px 10px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink);
      outline: none;
      width: 100%;
      min-width: 0;
    }
    .nav-search-input::placeholder { color: var(--text-muted); }
    .nav-search-btn {
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-left: 2px solid var(--ink);
      padding: 8px 10px;
      cursor: none;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .nav-search-btn:hover { background: var(--rust); }

    /* === FORM INPUTS === */
    .modern-input {
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 12px 16px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      color: var(--ink);
      width: 100%;
      transition: all 0.1s ease;
      box-shadow: 3px 3px 0 var(--ink);
    }
    .modern-input:focus {
      outline: none;
      border-color: var(--rust);
      box-shadow: 3px 3px 0 var(--rust);
    }
    .modern-input::placeholder { color: var(--text-muted); }
    textarea.modern-input {
      min-height: 200px;
      resize: vertical;
      line-height: 1.8;
      font-family: var(--font-serif);
      font-style: italic;
    }

    /* === COZY CARD === */
    .cozy-card {
      background: var(--paper);
      border: 3px solid var(--ink);
      padding: 32px;
      box-shadow: var(--shadow-md);
      transition: all 0.1s ease;
    }
    .cozy-card:hover { box-shadow: var(--shadow-lg); transform: translate(-2px, -2px); }

    /* === POEM CARD ENHANCED (home feed) === */
    .poem-card-enhanced {
      background: var(--paper);
      border: 3px solid var(--ink);
      padding: 32px;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .poem-card-enhanced::before { display: none; }
    .poem-card-enhanced:hover { box-shadow: var(--shadow-md); transform: translate(-3px, -3px); }
    .poem-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-avatar {
      width: 40px; height: 40px;
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--paper);
      flex-shrink: 0;
    }
    .card-author-info { flex: 1; }
    .card-author-name {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-author-date { font-size: 0.62rem; color: var(--text-muted); }
    .card-top-pick {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: var(--gold);
      color: #f0ebe0;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 2px solid var(--ink);
    }
    .card-poem-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 8px;
      cursor: none;
      transition: color 0.1s ease;
      letter-spacing: -0.01em;
    }
    .card-poem-title:hover { color: var(--rust); }
    .card-poem-preview {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      font-style: italic;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;

    /* === POEM CARD GRID (discover) === */

      text-transform: uppercase;

    .card-action-btn-compact:hover { background: var(--ink); color: var(--paper); }
    .card-action-btn-compact.like-active { background: var(--rust); color: var(--paper); border-color: var(--rust); }

    /* === POEM CARD LIST === */
    .poem-card-list {
      background: var(--paper);
      border: 3px solid var(--ink);

    .poem-card-list .card-poem-title { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 900; }

    /* === GRID LAYOUTS === */

    .poems-grid-lg { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 0; }
    .poem-grid-tile {

    .poem-grid-tile .tile-stats { display: flex; gap: 12px; }
    .poem-grid-tile .tile-stat { display: flex; align-items: center; gap: 4px; }

    /* === VIEW TOGGLE === */
    .view-toggle {
      display: flex;
      border: 2px solid var(--ink);

    .view-toggle-btn {

    /* === SECTION HEADERS === */

    /* === HERO SECTION === */

    /* === FEATURED CARD === */

    .lifetime-number { font-family: var(--font-serif); font-size: 2.5rem; font-weight: 900; color: var(--paper); line-height: 1.1; }
    .lifetime-sublabel { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
    .lifetime-chart { display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-top: 12px; }
    .lifetime-bar { flex: 1; background: var(--gold); opacity: 0.5; min-height: 4px; }

    /* === CATEGORY TABS === */
    .category-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      overflow-x: auto;
      scrollbar-width: none;
      border: 2px solid var(--ink);
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .category-tab {
      padding: 10px 18px;
      border: none;
      border-right: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: none;
      transition: all 0.1s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .category-tab:last-child { border-right: none; }
    .category-tab:hover { background: var(--cream); }
    .category-tab.active { background: var(--ink); color: var(--paper); }

    /* === TOAST === */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 3px solid var(--ink);
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.3s ease;
      white-space: nowrap;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.toast-hiding { opacity: 0; transform: translateY(16px); }
    .toast-default { background: var(--ink); color: var(--paper); }
    .toast-success { background: var(--ink); color: var(--paper); }
    .toast-error { background: var(--rust); color: #f0ebe0; border-color: var(--rust); }
    .toast-warning { background: var(--gold); color: var(--ink); border-color: var(--gold); }
    .toast-icon { flex-shrink: 0; width: 18px; height: 18px; }

    /* === LOADING === */
    .loader { width: 48px; height: 48px; border: 3px solid var(--cream); border-top-color: var(--rust); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-indicator { transition: opacity 0.3s ease; }
    #loading-indicator.fade-out { opacity: 0; pointer-events: none; }
    .feed-loader { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 24px 0; }
    .feed-spinner { width: 24px; height: 24px; border: 3px solid var(--cream); border-top-color: var(--rust); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .feed-loader-text { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .feed-end { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px 0; }
    .feed-end-line { flex: 1; max-width: 80px; height: 2px; background: var(--ink); }
    .feed-end-text { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

    /* === MODAL === */
    #modal-bg { backdrop-filter: blur(4px); transition: opacity 0.2s ease; }
    #modal { animation: pageEnter 0.2s ease-out; background: var(--paper); }

    /* === POEM POPUP === */
    .poem-popup-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 14, 11, 0.7);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; visibility: hidden;
      transition: all 0.2s ease;
    }
    .poem-popup-overlay.show { opacity: 1; visibility: visible; }
    .poem-popup {
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: var(--shadow-lg);
      max-width: 600px; width: 100%;
      max-height: 85vh; overflow-y: auto;
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }
    .poem-popup-overlay.show .poem-popup { transform: translateY(0); }
    .poem-popup-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px;
      border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
      cursor: none; display: flex; align-items: center; justify-content: center;
      transition: all 0.1s ease;
    }
    .poem-popup-close:hover { background: var(--ink); color: var(--paper); }

    /* === LINKS & MISC === */
    .poem-title-link { color: var(--rust); text-decoration: none; font-family: var(--font-serif); font-weight: 900; transition: color 0.1s ease; }
    .poem-title-link:hover { color: var(--gold); }
    .comments-section { background: var(--cream); padding: 16px; margin-top: 16px; border: 2px solid var(--ink); }
    .author-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
      background: var(--cream); border: 1px solid var(--ink);
      font-family: var(--font-mono); font-size: 0.62rem; color: var(--ink); font-weight: 700; text-transform: uppercase;
    }
    .date-text { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; }
    ::selection { background: rgba(196, 67, 10, 0.3); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--ink); }
    ::-webkit-scrollbar-thumb:hover { background: var(--rust); }
    :focus-visible { outline: 3px solid var(--rust); outline-offset: 2px; }
    button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }

    /* === ANIMATIONS === */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }
    .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; }
    .stagger-3 { animation-delay: 0.15s; } .stagger-4 { animation-delay: 0.2s; }
    .stagger-5 { animation-delay: 0.25s; } .stagger-6 { animation-delay: 0.3s; }
    .skeleton {
      background: linear-gradient(90deg, var(--cream) 25%, var(--paper) 50%, var(--cream) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* === IMAGE UPLOAD/CROP === */
    .image-upload-area { border: 3px dashed var(--ink); transition: all 0.1s ease; cursor: none; overflow: hidden; }
    .image-upload-area:hover, .image-upload-area.drag-over { border-style: solid; background: var(--cream); }
    .image-upload-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 32px; }
    .image-preview-container { position: relative; }
    .image-preview { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
    .remove-image-btn {
      position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
      border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
      font-size: 1.2rem; cursor: none; display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .remove-image-btn:hover { background: var(--rust); color: var(--paper); border-color: var(--rust); }
    .image-crop-overlay { position: fixed; inset: 0; background: rgba(15,14,11,0.8); z-index: 50001; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .image-crop-modal { background: var(--paper); border: 3px solid var(--ink); padding: 24px; max-width: 560px; width: 100%; max-height: 95vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .image-crop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .image-crop-header h3 { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 900; margin: 0; }
    .image-crop-header p { font-size: 0.7rem; color: var(--text-muted); margin: 4px 0 0; }
    .crop-ratio-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .crop-ratio-btn {
      padding: 6px 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
      font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; cursor: none; transition: all 0.1s ease;
    }
    .crop-ratio-btn:hover { background: var(--cream); }
    .crop-ratio-btn.active { background: var(--ink); color: var(--paper); }
    .image-crop-viewport {
      width: 100%; max-height: 55vh; aspect-ratio: 4 / 3; overflow: hidden; position: relative;
      cursor: grab; background: var(--cream); border: 3px solid var(--ink); touch-action: none; user-select: none; margin: 0 auto;
    }
    .image-crop-viewport:active { cursor: grabbing; }
    .image-crop-viewport img { position: absolute; max-width: none; max-height: none; user-select: none; -webkit-user-drag: none; }
    .image-crop-controls { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .image-crop-controls label { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-secondary); font-weight: 700; white-space: nowrap; text-transform: uppercase; }
    .image-crop-controls input[type="range"] { flex: 1; accent-color: var(--rust); height: 4px; }
    .image-crop-actions { display: flex; gap: 12px; margin-top: 20px; }
    .image-crop-actions button { flex: 1; }
    .image-lightbox { position: fixed; inset: 0; background: rgba(15,14,11,0.9); z-index: 50002; display: flex; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out; animation: fadeIn 0.2s ease; }
    .image-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border: 3px solid var(--ink); }
    .image-lightbox-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 2px solid var(--paper); background: transparent; color: var(--paper); font-size: 1.5rem; cursor: none; display: flex; align-items: center; justify-content: center; }
    .image-lightbox-close:hover { background: var(--paper); color: var(--ink); }
    .export-image-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; cursor: none; transition: all 0.1s ease; margin-top: 12px; }
    .export-image-btn:hover { background: var(--ink); color: var(--paper); }
    .bookmark-btn:hover { background: var(--cream); }

    /* === EMPTY STATE === */
    .empty-state { text-align: center; padding: 48px 0; }
    .empty-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 900; color: var(--ink); }
    .empty-subtitle { font-family: var(--font-mono); font-size: 0.78rem; margin-top: 8px; color: var(--text-muted); }
    .pagination-active { background: var(--ink) !important; color: var(--paper) !important; cursor: default !important; }
    .home-container { max-width: 100%; margin: 0 auto; padding: 0 16px; }

    /* === MAIN CONTENT === */
    /* Page wrapper (sidebar offset + footer push) */
    .page-wrapper {
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .main-content { padding-top: 0; flex: 1; }

    /* === FOOTER === */
    .rich-footer { background: var(--cream); border-top: 1px solid var(--border-subtle); padding: 60px 48px 32px; }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; max-width: 1000px; margin: 0 auto 32px; }
    .footer-col-title { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle); }
    .footer-col-links { display: flex; flex-direction: column; gap: 8px; }
    .footer-link { color: var(--text-secondary); text-decoration: none; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.1s ease; }
    .footer-link:hover { color: var(--rust); }
    .footer-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .footer-brand-name { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 900; color: var(--ink); }
    .footer-brand-desc { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
    .footer-bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 24px; border-top: 1px solid var(--border-subtle); max-width: 1000px; margin: 0 auto; flex-wrap: wrap; gap: 12px; }
    .footer-copy { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); }
    .footer-bottom-links { display: flex; gap: 16px; }
    .footer-bottom-links a { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
    .footer-bottom-links a:hover { color: var(--rust); }

    /* === ADMIN STYLES === */
    .admin-dashboard { padding: 0 16px 32px; }
    .admin-header { margin-bottom: 24px; }
    .admin-title { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 8px; margin: 0; }
    .admin-subtitle { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px; display: block; }
    .admin-loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 48px 0; color: var(--text-secondary); }
    .admin-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; margin-bottom: 24px; border: 3px solid var(--ink); }
    .admin-stat-card { background: var(--paper); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); padding: 20px; display: flex; align-items: center; gap: 16px; transition: background 0.1s ease; }
    .admin-stat-card:hover { background: var(--cream); }
    .admin-stat-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--cream); color: var(--rust); flex-shrink: 0; border: 2px solid var(--ink); }
    .admin-stat-info { display: flex; flex-direction: column; }
    .admin-stat-value { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
    .admin-stat-label { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }
    .admin-tabs { display: flex; gap: 0; border: 2px solid var(--ink); margin-bottom: 16px; overflow-x: auto; }
    .admin-tab { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border: none; border-right: 2px solid var(--ink); background: transparent; color: var(--ink); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; cursor: none; white-space: nowrap; transition: all 0.1s ease; }
    .admin-tab:last-child { border-right: none; }
    .admin-tab:hover { background: var(--cream); }
    .admin-tab.active { background: var(--ink); color: var(--paper); }
    .admin-tab-count { font-size: 0.58rem; background: var(--cream); color: var(--ink); padding: 1px 6px; font-weight: 700; border: 1px solid var(--ink); }
    .admin-tab.active .admin-tab-count { background: var(--rust); color: var(--paper); border-color: var(--rust); }
    .admin-table-wrap { overflow-x: auto; border: 3px solid var(--ink); background: var(--paper); }
    .admin-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.72rem; }
    .admin-table thead { background: var(--cream); }
    .admin-table th { padding: 12px; text-align: left; font-weight: 700; color: var(--ink); white-space: nowrap; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 3px solid var(--ink); }
    .admin-td { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); color: var(--ink); vertical-align: middle; }
    .admin-table tbody tr:hover { background: var(--cream); }
    .admin-table tbody tr:last-child .admin-td { border-bottom: none; }
    .admin-td-title { font-weight: 700; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-td-content { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
    .admin-td-id { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); }
    .admin-td-tags { max-width: 160px; }
    .admin-tag { display: inline-block; background: var(--cream); color: var(--ink); font-size: 0.58rem; padding: 2px 6px; margin: 1px; font-weight: 700; border: 1px solid var(--ink); }
    .admin-td-actions { white-space: nowrap; }
    .admin-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: none; transition: all 0.1s ease; }
    .admin-action-btn:hover { background: var(--ink); color: var(--paper); }
    .admin-delete-btn:hover { background: var(--rust); color: var(--paper); border-color: var(--rust); }
    .admin-empty { text-align: center; padding: 32px; color: var(--text-muted); font-family: var(--font-mono); }
    .admin-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--cream); border-top-color: var(--rust); border-radius: 50%; animation: spin 0.6s linear infinite; }
    .admin-denied { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 48px 16px; text-align: center; }
    .admin-denied h2 { font-family: var(--font-serif); font-size: 1.5rem; }
    .admin-denied p { color: var(--text-secondary); }
    .admin-header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .admin-header-actions { display: flex; gap: 8px; }
    .admin-refresh-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; cursor: none; transition: all 0.1s ease; }
    .admin-refresh-btn:hover { background: var(--ink); color: var(--paper); }
    .admin-notice { display: block; margin-top: 6px; font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); font-style: italic; }
    .admin-search-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 16px; background: var(--paper); border: 2px solid var(--ink); transition: border-color 0.1s ease; }
    .admin-search-bar:focus-within { border-color: var(--rust); }
    .admin-search-bar svg { flex-shrink: 0; color: var(--text-muted); }
    .admin-search-input { flex: 1; border: none; background: transparent; outline: none; font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink); }
    .admin-search-input::placeholder { color: var(--text-muted); }
    .admin-search-clear { border: none; background: transparent; color: var(--text-muted); font-size: 1.25rem; cursor: none; line-height: 1; padding: 0 4px; }
    .admin-search-clear:hover { color: var(--rust); }
    .admin-user-link { display: inline; border: none; background: transparent; padding: 0; margin: 0; text-align: left; color: inherit; font: inherit; cursor: none; }
    .admin-user-link:hover .admin-user-email { text-decoration: underline; }
    .admin-user-email { font-size: 0.7rem; color: var(--rust); font-weight: 700; }
    .admin-user-id { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); }
    .admin-poem-link { color: var(--rust); font-weight: 700; font-size: 0.72rem; }
    .admin-table-footer { text-align: right; font-size: 0.62rem; color: var(--text-muted); padding: 8px 8px 0; font-family: var(--font-mono); }
    .admin-pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; gap: 12px; flex-wrap: wrap; }
    .admin-pagination-info { font-size: 0.62rem; color: var(--text-muted); font-family: var(--font-mono); white-space: nowrap; }
    .admin-pagination-buttons { display: flex; align-items: center; gap: 4px; }
    .admin-page-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; cursor: none; transition: all 0.1s ease; }
    .admin-page-btn:hover:not(.disabled):not(.active) { background: var(--cream); }
    .admin-page-btn.active { background: var(--ink); color: var(--paper); pointer-events: none; }
    .admin-page-btn.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .admin-page-ellipsis { display: inline-flex; align-items: center; justify-content: center; width: 24px; color: var(--text-muted); font-size: 0.78rem; }
    .admin-overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .admin-overview-left { display: flex; flex-direction: column; gap: 16px; }
    .admin-overview-right { display: flex; flex-direction: column; }
    .admin-leaderboard { background: var(--paper); border: 3px solid var(--ink); padding: 16px; }
    .admin-leaderboard-title { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .admin-leaderboard-list { list-style: none; margin: 0; padding: 0; }
    .admin-leaderboard-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); font-size: 0.72rem; }

    // ===== THEME TOGGLE =====
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      updateThemeIcons();
    }

    function updateThemeIcons() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var sunSvg = '<svg id="theme-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      var moonSvg = '<svg id="theme-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
      var mobileSunSvg = '<svg id="mobile-theme-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      var mobileMoonSvg = '<svg id="mobile-theme-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
      var el = document.getElementById('theme-icon');
      if (el) el.parentElement.innerHTML = isDark ? sunSvg : moonSvg;
      var mobileEl = document.getElementById('mobile-theme-icon');
      if (mobileEl) mobileEl.parentElement.innerHTML = isDark ? mobileSunSvg : mobileMoonSvg;
    }

    // ===== AUTH STATE =====
    window.setNavAuthState = function setNavAuthState(isLoggedIn, isAdminUser) {
      var show = function(el) { if (el) el.classList.remove('hidden'); };
      var hide = function(el) { if (el) el.classList.add('hidden'); };
      // Sidebar nav
      var navLogin = document.getElementById('nav-login');
      var navRegister = document.getElementById('nav-register');
      var navAuthSection = document.getElementById('nav-auth-section');
      var navUserProfile = document.getElementById('nav-user-profile');
      var navMyPoems = document.getElementById('nav-my-poems');
      var navAddPoem = document.getElementById('nav-add-poem');
      var navAdmin = document.getElementById('nav-admin');
      var navLiked = document.getElementById('nav-liked');
      var navHistory = document.getElementById('nav-history');
      var navLogout = document.getElementById('nav-logout');
      // Legacy mobile
      var loginMobile = document.getElementById('nav-login-mobile');
      var registerMobile = document.getElementById('nav-register-mobile');
      var myPoemsMobile = document.getElementById('nav-my-poems-mobile');
      var addPoemMobile = document.getElementById('nav-add-poem-mobile');
      var adminMobile = document.getElementById('nav-admin-mobile');
      var logoutMobile = document.getElementById('nav-logout-mobile');

      if (isLoggedIn) {
        hide(navLogin); hide(navRegister);
        if (navAuthSection) navAuthSection.style.display = 'none';
        show(navUserProfile);
        show(navMyPoems); show(navAddPoem); show(navLiked); show(navHistory); show(navLogout);
        if (isAdminUser) show(navAdmin); else hide(navAdmin);
        // Legacy
        hide(loginMobile); hide(registerMobile);
        show(myPoemsMobile); show(addPoemMobile); show(logoutMobile);
        if (isAdminUser) show(adminMobile); else hide(adminMobile);
      } else {
        show(navLogin); show(navRegister);
        if (navAuthSection) navAuthSection.style.display = '';
        hide(navUserProfile);
        hide(navMyPoems); hide(navAddPoem); hide(navAdmin); hide(navLiked); hide(navHistory); hide(navLogout);
        // Legacy
        show(loginMobile); show(registerMobile);
        hide(myPoemsMobile); hide(addPoemMobile); hide(adminMobile); hide(logoutMobile);
      }
    };

    // ===== DOM READY =====
    document.addEventListener('DOMContentLoaded', function() {
      // Theme toggle
      var themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
      updateThemeIcons();

      // Nav logo â†’ home
      var navTitle = document.getElementById('nav-title');
      if (navTitle) navTitle.addEventListener('click', function() { window.location.hash = '#/home'; });
      var navTitleMobile = document.getElementById('nav-title-mobile');
      if (navTitleMobile) navTitleMobile.addEventListener('click', function() { window.location.hash = '#/home'; });

      // Mobile theme toggle
      var mobileThemeToggle = document.getElementById('mobile-theme-toggle');
      if (mobileThemeToggle) mobileThemeToggle.addEventListener('click', toggleTheme);

      // === CUSTOM CURSOR ===
      var cursorEl = document.getElementById('cursor');
      if (cursorEl && !('ontouchstart' in window) && navigator.maxTouchPoints === 0) {
        document.addEventListener('mousemove', function(e) {
          cursorEl.style.left = e.clientX + 'px';
          cursorEl.style.top = e.clientY + 'px';
        });
        var interactiveSelector = 'a, button, input, textarea, select, [role="button"], .poem-card-grid, .poem-card-enhanced, .poem-card-list, .poem-grid-tile, .featured-card, .stat-cell, .collection-card';
        document.addEventListener('mouseenter', function(e) {
          if (e.target.matches && e.target.matches(interactiveSelector)) cursorEl.classList.add('expand');
        }, true);
        document.addEventListener('mouseleave', function(e) {
          if (e.target.matches && e.target.matches(interactiveSelector)) cursorEl.classList.remove('expand');
        }, true);
      }

      // === MOBILE SIDEBAR TOGGLE ===
      var hamburger = document.getElementById('hamburger-menu');
      var navSidebar = document.querySelector('nav');
      var overlay = document.getElementById('sidebar-overlay');

      function openSidebar() {
        navSidebar.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
      function closeSidebar() {
        navSidebar.classList.remove('open');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
      }
      if (hamburger) hamburger.addEventListener('click', function() {
        if (navSidebar.classList.contains('open')) closeSidebar();
        else openSidebar();
      });
      if (overlay) overlay.addEventListener('click', closeSidebar);

      // Close sidebar on nav button click (mobile)
      document.querySelectorAll('.nav-sidebar-btn, .compose-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (window.innerWidth <= 900) closeSidebar();
        });
      });

      // Close sidebar on resize to desktop
      window.addEventListener('resize', function() {
        if (window.innerWidth > 900) closeSidebar();
      });

      // === SMART STICKY SIDEBAR (for home-sidebar widget) ===
      (function initSmartSidebar() {
        var TOP_OFFSET = 24;
        var currentTop = TOP_OFFSET;
        var lastScrollY = window.scrollY;
        var ticking = false;
        function updateSidebar() {
          ticking = false;
          var sidebar = document.querySelector('.home-sidebar');
          if (!sidebar) return;
          var scrollY = window.scrollY;
          var scrollDelta = scrollY - lastScrollY;
          var viewportHeight = window.innerHeight;
          var sidebarHeight = sidebar.offsetHeight;
          if (sidebarHeight <= viewportHeight - TOP_OFFSET) {
            sidebar.style.top = TOP_OFFSET + 'px';
            lastScrollY = scrollY;
            return;
          }
          var maxTop = TOP_OFFSET;
          var minTop = viewportHeight - sidebarHeight - 16;
          currentTop = currentTop - scrollDelta;
          currentTop = Math.max(minTop, Math.min(maxTop, currentTop));
          sidebar.style.top = currentTop + 'px';
          lastScrollY = scrollY;
        }
        window.addEventListener('scroll', function() {
          if (!ticking) { requestAnimationFrame(updateSidebar); ticking = true; }
        }, { passive: true });
        window.addEventListener('resize', function() { currentTop = TOP_OFFSET; lastScrollY = window.scrollY; updateSidebar(); }, { passive: true });
        var observer = new MutationObserver(function() {
          setTimeout(function() {
            currentTop = TOP_OFFSET;
            lastScrollY = window.scrollY;
            var sidebar = document.querySelector('.home-sidebar');
            if (sidebar) sidebar.style.top = TOP_OFFSET + 'px';
          }, 100);
        });
        var appEl = document.getElementById('app');
        if (appEl) observer.observe(appEl, { childList: true });
      })();

      // View toggle compat (legacy)
      var viewToggleTrigger = document.getElementById('view-toggle-trigger');
      var viewToggleDropdown = document.getElementById('view-toggle-dropdown');
      var headerViewToggle = document.getElementById('header-view-toggle');
      if (viewToggleTrigger && viewToggleDropdown && headerViewToggle) {
        viewToggleTrigger.addEventListener('click', function(e) { e.stopPropagation(); viewToggleDropdown.classList.toggle('open'); });
        document.addEventListener('click', function(e) {
          if (!viewToggleDropdown.contains(e.target) && !viewToggleTrigger.contains(e.target)) viewToggleDropdown.classList.remove('open');
        });
        headerViewToggle.addEventListener('click', function(e) {
          var btn = e.target.closest('.view-toggle-btn');
          if (!btn) return;
          var view = btn.dataset.view;
          localStorage.setItem('poemViewMode', view);
          headerViewToggle.querySelectorAll('.view-toggle-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.view === view); });
          viewToggleDropdown.classList.remove('open');
          window.dispatchEvent(new CustomEvent('viewModeChanged', { detail: { view: view } }));
        });
      }
    });
  </script>
</body>
