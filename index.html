<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./assets/unblot_logo.png">
  <title>Unblot</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Tailwind CSS via CDN -->
  <!-- Modern UI/UX styles with glassmorphism and smooth animations -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Force hide utility for elements that Tailwind overrides */
    .force-hide { display: none !important; }
    
    :root {
      /* Modern color palette */
      --primary: #6366f1;
      --primary-light: #a5b4fc;
      --primary-dark: #4f46e5;
      --accent: #f472b6;
      --accent-light: #fbcfe8;
      --surface: rgba(255, 255, 255, 0.8);
      --surface-elevated: rgba(255, 255, 255, 0.95);
      --background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 50%, #f5f3ff 100%);
      --text-primary: #1e1b4b;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: rgba(99, 102, 241, 0.15);
      --shadow-sm: 0 2px 8px rgba(99, 102, 241, 0.08);
      --shadow-md: 0 8px 24px rgba(99, 102, 241, 0.12);
      --shadow-lg: 0 16px 48px rgba(99, 102, 241, 0.16);
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--background);
      background-attachment: fixed;
      font-family: 'Quicksand', 'Segoe UI', Arial, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, .poem-title, .poem-title-link {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Modern glassmorphism card */
    .poem-content {
      font-family: 'Quicksand', 'Segoe UI', Arial, sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.8;
      color: var(--text-primary);
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      margin: 0;
    }

    /* Utility classes */
    .hidden {
      display: none !important;
    }

    /* Modern Navigation */
    nav {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--border);
    }

    .nav-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.02em;
    }

    /* Modern pill buttons */
    .nav-btn {
      background: linear-gradient(135deg, var(--primary-light) 0%, #c4b5fd 100%);
      color: var(--primary-dark);
      border-radius: var(--radius-full);
      padding: 0.5em 1.25em;
      font-weight: 600;
      font-size: 0.875rem;
      font-family: 'Quicksand', Arial, sans-serif;
      transition: all var(--transition-normal);
      box-shadow: var(--shadow-sm);
      border: 1px solid transparent;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .nav-btn:hover, .nav-btn:focus {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: #fff;
    }

    .nav-btn:hover::before, .nav-btn:focus::before {
      opacity: 1;
    }

    .nav-btn span, .nav-btn {
      position: relative;
      z-index: 1;
    }

    .nav-btn:active {
      transform: translateY(0);
    }

    /* Side nav for mobile */
    .side-nav-btn {
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      margin: 0;
      background: transparent;
      color: var(--text-primary);
      font-weight: 500;
      transition: all var(--transition-fast);
      position: relative;
    }

    .side-nav-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 4px;
      height: 60%;
      background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 0 4px 4px 0;
      transition: transform var(--transition-fast);
    }

    .side-nav-btn:hover, .side-nav-btn:focus, .side-nav-btn.active {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.08) 0%, transparent 100%) !important;
      color: var(--primary) !important;
    }

    .side-nav-btn:hover::before, .side-nav-btn:focus::before, .side-nav-btn.active::before {
      transform: translateY(-50%) scaleY(1);
    }

    /* Side panel - hidden by default */
    #side-panel {
      display: none;
    }

    /* Responsive styles for mobile */
    @media (max-width: 700px) {
      #side-panel {
        display: flex !important;
      }
      .header-tagline {
        display: none !important;
      }
      .nav-title {
        font-size: 1.25rem;
        margin-bottom: 0;
        flex-direction: row;
        align-items: center;
        gap: 0.5em;
      }
      .nav-title .flex {
        flex-direction: row;
        align-items: center;
        gap: 0.5em;
      }
      .nav-title .text-xs {
        margin-left: 0.5em !important;
        font-size: 0.75rem;
        white-space: nowrap;
      }
      .hamburger {
        display: flex;
        align-items: center;
        margin-left: 0.5em;
      }
      .nav-actions {
        display: none !important;
      }
      
      /* Side Panel Styles */
      #side-panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        max-width: 85vw;
        height: 100vh;
        background: #ffffff;
        box-shadow: 4px 0 25px rgba(0, 0, 0, 0.15);
        z-index: 9999;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #side-panel.open {
        transform: translateX(0);
      }
      .side-panel-content {
        flex: 1;
        padding-top: 70px;
        overflow-y: auto;
        background: #ffffff;
      }
      .side-nav-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 16px 24px;
        background: #ffffff;
        border: none;
        font-size: 1rem;
        font-weight: 500;
        color: #374151;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        text-decoration: none;
      }
      .side-nav-btn:hover {
        background: #f3f4f6;
        color: var(--primary);
      }
      .side-nav-btn.logout-btn {
        color: #dc2626;
      }
      .side-nav-btn.logout-btn:hover {
        background: #fef2f2;
      }
      .side-panel-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 20px;
        border-top: 1px solid #e5e7eb;
        background: #ffffff;
      }
      .side-panel-brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #side-panel .mobile-view-toggle {
        display: flex;
        justify-content: center;
        padding: 16px;
        margin-top: 8px;
        border-top: 1px solid #e5e7eb;
        background: #ffffff;
      }
      #side-panel .view-toggle {
        background: #f3f4f6;
      }
      .mobile-view-toggle {
        padding: 16px;
        margin-top: 8px;
        border-top: 1px solid #e5e7eb;
      }
      .mobile-view-toggle .view-toggle {
        background: #f3f4f6;
        justify-content: center;
      }
      #side-panel-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9998;
      }
      #side-panel-overlay.show {
        display: block;
      }
      
      #side-panel .font-bold {
        font-family: 'Playfair Display', Georgia, serif;
      }
      #header-search-form {
        display: none !important;
      }
      #header-search-icon {
        display: flex !important;
      }
      
      /* Mobile card adjustments */
      .cozy-card {
        padding: 1.25rem !important;
        margin: 1rem 0 !important;
        border-radius: var(--radius-md) !important;
      }
      
      .poem-card {
        padding: 1.25rem !important;
        border-radius: var(--radius-md) !important;
      }
      
      /* Mobile form inputs */
      .cozy-input {
        padding: 0.75rem 1rem !important;
        font-size: 1rem !important;
      }
      
      /* Mobile main content */
      main {
        padding-top: 4.5rem !important;
      }
      
      /* Mobile w-full containers */
      .w-full {
        padding: 0 !important;
      }
    }

    @media (min-width: 701px) {
      .hamburger {
        display: none;
      }
      .nav-actions {
        display: flex !important;
        flex-direction: row;
        position: static;
        background: none;
        box-shadow: none;
        gap: 0.5rem;
      }
      #header-search-form {
        display: flex !important;
      }
      #header-search-icon {
        display: none !important;
      }
      #side-panel {
        display: none !important;
      }
      #side-panel-overlay {
        display: none !important;
      }
      .mobile-view-toggle {
        display: none !important;
      }
    }

    /* Pagination active state */
    .pagination-active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%) !important;
      color: #fff !important;
      box-shadow: var(--shadow-md) !important;
      cursor: default !important;
    }

    /* Modern glass card */
    .cozy-card {
      background: var(--surface-elevated);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: 2rem;
      margin: 1.5rem 0;
      transition: all var(--transition-normal);
    }

    .cozy-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    /* Modern poem card */
    .poem-card {
      background: var(--surface-elevated);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: 1.75rem;
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .poem-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 50%, var(--primary-light) 100%);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .poem-card:hover {
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      transform: translateY(-4px);
    }

    .poem-card:hover::before {
      opacity: 1;
    }

    /* Grid view for poems - different sizes */
    .poems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .poems-grid-sm {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
      width: 100%;
    }

    .poems-grid-lg {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    .poem-grid-tile {
      background: var(--surface-elevated);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 1.25rem;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      flex-direction: column;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    /* Small grid tile adjustments */
    .poems-grid-sm .poem-grid-tile {
      padding: 0.875rem;
      min-height: 140px;
    }

    .poems-grid-sm .tile-title {
      font-size: 0.95rem !important;
      margin-bottom: 0.375rem !important;
    }

    .poems-grid-sm .tile-preview {
      font-size: 0.75rem !important;
      -webkit-line-clamp: 3 !important;
      line-clamp: 3 !important;
    }

    .poems-grid-sm .tile-meta {
      font-size: 0.625rem !important;
      margin-top: 0.5rem !important;
      padding-top: 0.5rem !important;
    }

    .poems-grid-sm .tile-stats svg {
      width: 10px;
      height: 10px;
    }

    /* Large grid tile adjustments */
    .poems-grid-lg .poem-grid-tile {
      padding: 1.5rem;
      min-height: 220px;
    }

    .poems-grid-lg .tile-title {
      font-size: 1.25rem !important;
    }

    .poems-grid-lg .tile-preview {
      font-size: 0.9rem !important;
      -webkit-line-clamp: 5 !important;
      line-clamp: 5 !important;
    }

    .poem-grid-tile::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .poem-grid-tile:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary-light);
    }

    .poem-grid-tile:hover::before {
      opacity: 1;
    }

    .poem-grid-tile .tile-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .poem-grid-tile .tile-preview {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .poem-grid-tile .tile-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .poem-grid-tile .tile-stats {
      display: flex;
      gap: 0.75rem;
    }

    .poem-grid-tile .tile-stat {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* View toggle button - in header */
    .view-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-full);
      padding: 0.2rem;
      border: 1px solid var(--border);
      gap: 0.15rem;
      box-shadow: var(--shadow-sm);
    }

    .view-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .view-toggle-btn svg {
      width: 16px;
      height: 16px;
    }

    .view-toggle-btn:hover {
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
    }

    .view-toggle-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Collapsible view toggle dropdown */
    .view-toggle-container {
      position: relative;
    }

    .view-toggle-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .view-toggle-trigger:hover {
      background: rgba(99, 102, 241, 0.1);
    }

    .view-toggle-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 0.5rem;
      display: none;
      z-index: 1000;
    }

    .view-toggle-dropdown.open {
      display: block;
    }

    .view-toggle-dropdown .view-toggle {
      flex-direction: column;
      border: none;
      box-shadow: none;
      padding: 0;
      gap: 0.25rem;
    }

    .view-toggle-dropdown .view-toggle-btn {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      justify-content: flex-start;
      gap: 0.5rem;
    }

    .view-toggle-dropdown .view-toggle-btn span {
      font-size: 0.875rem;
    }

    /* Header icon button (logout, etc) */
    .header-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .header-icon-btn:hover {
      background: rgba(99, 102, 241, 0.1);
      color: var(--primary);
    }

    .header-icon-btn.logout-icon:hover {
      background: rgba(220, 38, 38, 0.1);
      color: #dc2626;
    }

    /* Header actions group */
    .header-actions-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    @media (max-width: 768px) {
      .header-actions-group.desktop-only {
        display: none;
      }
    }

    /* Mobile header view toggle */
    .mobile-header-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .mobile-header-toggle {
        display: flex;
      }
      .mobile-header-toggle .view-toggle-container {
        display: block;
      }
    }

    /* Hide view toggle on mobile in header, show in side panel */
    @media (max-width: 700px) {
      #header-view-toggle {
        display: none;
      }
      .mobile-view-toggle {
        display: flex !important;
        justify-content: center;
        padding: 1rem;
        border-top: 1px solid var(--border);
      }
      
      /* Mobile grid responsiveness */
      .poems-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
        gap: 0.75rem !important;
        padding: 0 0.25rem;
      }
      
      .poems-grid-sm {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important;
        gap: 0.5rem !important;
        padding: 0 0.25rem;
      }
      
      .poems-grid-lg {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
        gap: 0.75rem !important;
        padding: 0 0.25rem;
      }
      
      /* Mobile tile adjustments */
      .poem-grid-tile {
        padding: 0.75rem !important;
        min-height: 120px !important;
      }
      
      .poem-grid-tile .tile-title {
        font-size: 0.9rem !important;
        margin-bottom: 0.375rem !important;
      }
      
      .poem-grid-tile .tile-preview {
        font-size: 0.75rem !important;
        -webkit-line-clamp: 3 !important;
        line-clamp: 3 !important;
      }
      
      .poem-grid-tile .tile-meta {
        font-size: 0.6rem !important;
        margin-top: 0.5rem !important;
        padding-top: 0.5rem !important;
      }
      
      .poem-grid-tile .tile-stats svg {
        width: 10px !important;
        height: 10px !important;
      }
      
      /* Mobile list view */
      #poems-container.grid.gap-6 {
        gap: 1rem !important;
        padding: 0 0.5rem;
      }
      
      /* Section header on mobile */
      .section-header {
        font-size: 1.5rem !important;
        padding: 0 0.5rem;
      }
      
      /* App container padding */
      #app {
        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
      }
    }

    @media (min-width: 701px) {
      .mobile-view-toggle {
        display: none !important;
      }
    }

    /* Poem popup modal */
    .poem-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-normal);
    }

    .poem-popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .poem-popup {
      background: var(--surface-elevated);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: transform var(--transition-normal);
    }

    @media (max-width: 700px) {
      .poem-popup {
        max-width: calc(100vw - 1rem);
        max-height: 90vh;
        border-radius: var(--radius-md);
        margin: 0.5rem;
      }
      
      .poem-popup-overlay {
        padding: 0.5rem;
      }
    }

    .poem-popup-overlay.show .poem-popup {
      transform: scale(1) translateY(0);
    }

    .poem-popup-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .poem-popup-close:hover {
      background: var(--primary);
      color: white;
    }

    /* Modern form inputs */
    .modern-input {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      transition: all var(--transition-fast);
      width: 100%;
    }

    .modern-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .modern-input::placeholder {
      color: var(--text-muted);
    }

    /* Modern action buttons */
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.8125rem;
      font-family: 'Inter', sans-serif;
      transition: all var(--transition-fast);
      border: none;
      cursor: pointer;
    }

    .action-btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    .action-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .action-btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .action-btn-secondary:hover {
      background: #fff;
      border-color: var(--primary-light);
      color: var(--primary);
    }

    .action-btn-like {
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
      color: #be185d;
    }

    .action-btn-like:hover, .action-btn-like.active {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #fff;
      transform: scale(1.05);
    }

    /* Tags styling */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(244, 114, 182, 0.1) 100%);
      color: var(--primary);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.15);
    }

    /* Section headers */
    .section-header {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-full);
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      opacity: 0;
      transition: all var(--transition-normal);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Smooth animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: var(--shadow-md);
      }
      50% {
        box-shadow: var(--shadow-lg), var(--shadow-glow);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 0.5s ease-out forwards;
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }

    /* Selection styling */
    ::selection {
      background: rgba(99, 102, 241, 0.2);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(99, 102, 241, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--primary-light) 0%, var(--primary) 100%);
      border-radius: var(--radius-full);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* Loading spinner modern */
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modern modal */
    #modal-bg {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #modal {
      animation: fadeInUp 0.3s ease-out;
    }

    /* Link styles */
    .poem-title-link {
      color: var(--primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .poem-title-link:hover {
      color: var(--primary-dark);
    }

    /* Comments section */
    .comments-section {
      background: rgba(99, 102, 241, 0.03);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1rem;
      border: 1px solid var(--border);

    /* Author badge */

    }

    // Utility to show/hide nav buttons based on login state
    window.setNavAuthState = function setNavAuthState(isLoggedIn) {
      // Mobile nav only (desktop uses hidden class via updateNav)
      const show = el => { if (el) el.classList.remove('hidden'); };
      const hide = el => { if (el) el.classList.add('hidden'); };
      
      const loginMobile = document.getElementById('nav-login-mobile');
      const registerMobile = document.getElementById('nav-register-mobile');
      const discoverMobile = document.getElementById('nav-discover-mobile');
      const myPoemsMobile = document.getElementById('nav-my-poems-mobile');
      const addPoemMobile = document.getElementById('nav-add-poem-mobile');
      const logoutMobile = document.getElementById('nav-logout-mobile');
      const navLogout = document.getElementById('nav-logout');
      
      // Always show discover
      show(discoverMobile);
      
      if (isLoggedIn) {
        hide(loginMobile);
        hide(registerMobile);
        show(myPoemsMobile);
        show(addPoemMobile);
        show(logoutMobile);
        show(navLogout);
      } else {
        show(loginMobile);
        show(registerMobile);
        hide(myPoemsMobile);
        hide(addPoemMobile);
        hide(logoutMobile);
        hide(navLogout);
      }
    }

    // Clickable nav title/logo to go to homepage
    document.addEventListener('DOMContentLoaded', function() {
      // Mobile search toggle logic
      const searchIcon = document.getElementById('header-search-icon');
      const searchFormMobile = document.getElementById('header-search-form-mobile');
      const searchInputMobile = document.getElementById('header-search-input-mobile');
      if (searchIcon && searchFormMobile && searchInputMobile) {
        // Show search bar, remove icon from DOM
        const searchIconParent = searchIcon.parentNode;
        let searchIconNextSibling = searchIcon.nextSibling;
        searchIcon.addEventListener('click', function() {
          if (searchIcon.parentNode) {
            searchIconParent.removeChild(searchIcon);
          }
          setTimeout(function() {
            searchFormMobile.classList.remove('hidden');
            searchInputMobile.focus();
          }, 0);
        });
        // Hide search bar, show icon on blur or submit
        searchFormMobile.addEventListener('submit', function(e) {
          searchFormMobile.classList.add('hidden');
          // Re-insert search icon if not present
          if (!document.getElementById('header-search-icon')) {
            if (searchIconNextSibling) {
              searchIconParent.insertBefore(searchIcon, searchIconNextSibling);
            } else {
              searchIconParent.appendChild(searchIcon);
            }
          }
        });
        searchInputMobile.addEventListener('blur', function() {
          setTimeout(function() {
            if (document.activeElement !== searchInputMobile) {
              searchFormMobile.classList.add('hidden');
              // Re-insert search icon if not present
              if (!document.getElementById('header-search-icon')) {
                if (searchIconNextSibling) {
                  searchIconParent.insertBefore(searchIcon, searchIconNextSibling);
                } else {
                  searchIconParent.appendChild(searchIcon);
                }
              }
            }
          }, 100);
        });
      }
      const navTitle = document.getElementById('nav-title');
      if (navTitle) {
        navTitle.addEventListener('click', function() {
          window.location.hash = '';
        });
      }
      // Hamburger menu toggle for mobile (side panel)
      const hamburger = document.getElementById('hamburger-menu');
      const sidePanel = document.getElementById('side-panel');
      const sidePanelOverlay = document.getElementById('side-panel-overlay');
      
      function openSidePanel() {
        sidePanel.classList.add('open');
        sidePanel.style.transform = 'translateX(0)';
        sidePanelOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
      
      function closeSidePanel() {
        sidePanel.classList.remove('open');
        sidePanel.style.transform = '';
        sidePanelOverlay.classList.remove('show');
        document.body.style.overflow = '';
      }
      
      // Open side panel
      hamburger.addEventListener('click', openSidePanel);
      
      // Close side panel when clicking overlay
      sidePanelOverlay.addEventListener('click', closeSidePanel);

      // Hide mobile search icon after click
      // ...existing code...
      // Close side panel on click outside or swipe
      document.addEventListener('mousedown', function(e) {
        if (window.innerWidth <= 700 && sidePanel.classList.contains('open')) {
          if (!sidePanel.contains(e.target) && !hamburger.contains(e.target)) {
            closeSidePanel();
          }
        }
      });
      // Navigation actions for side panel (mobile)
      document.getElementById('nav-login-mobile').addEventListener('click', function() { window.location.hash = 'login'; closeSidePanel(); });
      document.getElementById('nav-register-mobile').addEventListener('click', function() { window.location.hash = 'register'; closeSidePanel(); });
      document.getElementById('nav-discover-mobile').addEventListener('click', function() { window.location.hash = 'discover'; closeSidePanel(); });
      document.getElementById('nav-my-poems-mobile').addEventListener('click', function() { window.location.hash = 'my-poems'; closeSidePanel(); });
      document.getElementById('nav-add-poem-mobile').addEventListener('click', function() { window.location.hash = 'add-poem'; closeSidePanel(); });
      document.getElementById('nav-logout-mobile').addEventListener('click', async function() {
        try {
          // Dynamically import the logout logic from main.js
          const main = await import('./main.js');
          if (main && typeof main.handleLogout === 'function') {
            await main.handleLogout();
          } else {
            // fallback: go to home
            window.location.hash = '#home';
          }
        } catch (e) {
          window.location.hash = '#home';
        }
        closeSidePanel();
      });
      // Hide side panel on resize
      window.addEventListener('resize', function() {
        if (window.innerWidth > 700) {
          closeSidePanel();
        }
      });
      
      // View toggle dropdown logic
      const viewToggleTrigger = document.getElementById('view-toggle-trigger');
      const viewToggleDropdown = document.getElementById('view-toggle-dropdown');
      const headerViewToggle = document.getElementById('header-view-toggle');
      
      if (viewToggleTrigger && viewToggleDropdown) {
        // Toggle dropdown on click
        viewToggleTrigger.addEventListener('click', function(e) {
          e.stopPropagation();
          viewToggleDropdown.classList.toggle('open');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
          if (!viewToggleDropdown.contains(e.target) && !viewToggleTrigger.contains(e.target)) {
            viewToggleDropdown.classList.remove('open');
          }
        });
        
        // Update active state based on saved preference (both desktop and mobile)
        function updateViewToggleActiveState() {
          const savedView = localStorage.getItem('poemViewMode') || 'grid';
          
          // Update desktop toggle
          const desktopButtons = headerViewToggle.querySelectorAll('.view-toggle-btn');
          desktopButtons.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.view === savedView);
          });
          
          // Update mobile toggle
          const mobileViewToggle = document.getElementById('mobile-view-toggle');
          if (mobileViewToggle) {
            const mobileButtons = mobileViewToggle.querySelectorAll('.view-toggle-btn');
            mobileButtons.forEach(btn => {
              btn.classList.toggle('active', btn.dataset.view === savedView);
            });
          }
        }
        
        // Handle view toggle button clicks (desktop)
        if (headerViewToggle) {
          headerViewToggle.addEventListener('click', function(e) {
            const btn = e.target.closest('.view-toggle-btn');
            if (!btn) return;
            
            const view = btn.dataset.view;
            localStorage.setItem('poemViewMode', view);
            
            // Update active state
            updateViewToggleActiveState();
            
            // Close dropdown
            viewToggleDropdown.classList.remove('open');
            
            // Dispatch custom event for views to listen to
            window.dispatchEvent(new CustomEvent('viewModeChanged', { detail: { view } }));
          });
        }
        
        // Initialize active state
        updateViewToggleActiveState();
      }
      
      // Mobile header view toggle (between search and hamburger)
      const mobileViewToggleTrigger = document.getElementById('mobile-view-toggle-trigger');
      const mobileViewToggleDropdown = document.getElementById('mobile-view-toggle-dropdown');
      const mobileHeaderViewToggle = document.getElementById('mobile-header-view-toggle');
      
      if (mobileViewToggleTrigger && mobileViewToggleDropdown) {
        // Toggle dropdown on click
        mobileViewToggleTrigger.addEventListener('click', function(e) {
          e.stopPropagation();
          mobileViewToggleDropdown.classList.toggle('open');
          // Close desktop dropdown if open
          if (viewToggleDropdown) viewToggleDropdown.classList.remove('open');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
          if (!mobileViewToggleDropdown.contains(e.target) && !mobileViewToggleTrigger.contains(e.target)) {
            mobileViewToggleDropdown.classList.remove('open');
          }
        });
      }
      
      if (mobileHeaderViewToggle) {
        mobileHeaderViewToggle.addEventListener('click', function(e) {
          const btn = e.target.closest('.view-toggle-btn');
          if (!btn) return;
          
          const view = btn.dataset.view;
          localStorage.setItem('poemViewMode', view);
          
          // Update all toggles
          updateAllViewToggles(view);
          
          // Close dropdown
          mobileViewToggleDropdown.classList.remove('open');
          
          // Dispatch custom event for views to listen to
          window.dispatchEvent(new CustomEvent('viewModeChanged', { detail: { view } }));
        });
        
        // Initialize mobile header toggle active state
        const savedView = localStorage.getItem('poemViewMode') || 'grid';
        const buttons = mobileHeaderViewToggle.querySelectorAll('.view-toggle-btn');
        buttons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === savedView);
        });
      }
      
      // Helper function to update all view toggles
      function updateAllViewToggles(view) {
        // Desktop toggle
        const headerViewToggle = document.getElementById('header-view-toggle');
        if (headerViewToggle) {
          headerViewToggle.querySelectorAll('.view-toggle-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.view === view);
          });
        }
        
        // Mobile header toggle
        const mobileHeaderViewToggle = document.getElementById('mobile-header-view-toggle');
        if (mobileHeaderViewToggle) {
          mobileHeaderViewToggle.querySelectorAll('.view-toggle-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.view === view);
          });
        }
      }
      
      // setNavAuthState is now called automatically by updateNav in auth.js
    });
  </script>
</body>
</html>
